name: CI

# Runs on pushes to main (i.e. after a lesson branch is merged in) and on
# pull requests targeting main (so a broken build is caught before merging,
# not after).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (macOS + SDL2)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL2
        run: brew install sdl2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # No test suite yet. Once one exists (ctest, GoogleTest, Catch2, or
      # even just a few opcode-checking .ch8 ROMs run headlessly), add:
      #
      # - name: Test
      #   run: ctest --test-dir build --output-on-failure
